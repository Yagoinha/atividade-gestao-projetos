<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Hipotético - Login</title>
    <script>
        function validarLogin(event) {
            event.preventDefault();
            var usuario = document.getElementById("usuario").value.trim();

            // Regras da atividade:
            // Em branco -> msg.html
            // 'admin' -> pg001.html (Administrador)
            // Qualquer outro -> pg002.html (Operador)
            if (usuario === "") {
                window.location.href = "msg.html";
            } else if (usuario.toLowerCase() === "admin") {
                window.location.href = "pg001.html";
            } else {
                window.location.href = "pg002.html";
            }
            return false;
        }
    </script>
</head>
<body>
    <table border="0" width="100%">
        <tr>
            <td valign="middle">
                <font size="2" face="Arial"><b>INSTITUTO FEDERAL</b><br>São Paulo<br>Câmpus Bragança Paulista</font>
            </td>
            <td align="right" valign="middle">
                <h2>Sistema Hipotético para Atividade Prática</h2>
            </td>
        </tr>
    </table>
    <hr>
    <br><br>
    <center>
        <form onsubmit="return validarLogin(event)">
            <table border="0" cellpadding="5">
                <tr>
                    <td align="right"><b>USUÁRIO:</b></td>
                    <td><input type="text" name="usuario" id="usuario"></td>
                </tr>
                <tr>
                    <td align="right"><b>SENHA:</b></td>
                    <td><input type="password" name="senha" id="senha"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                      <br>
                      <input type="submit" value="ENTRAR">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>
</html>
