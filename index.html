<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Hipotético - Login</title>
</head>
<body>
    
<table border="0" width="100%">
    <tr>
        <td width="80" align="center" valign="middle">
            <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- IFSP stylized grid logo -->
                <circle cx="20" cy="20" r="12" fill="#E2231A" />
                <rect x="38" y="8" width="24" height="24" rx="4" fill="#00923F" />
                <rect x="68" y="8" width="24" height="24" rx="4" fill="#00923F" />
                
                <rect x="8" y="38" width="24" height="24" rx="4" fill="#00923F" />
                <rect x="38" y="38" width="24" height="24" rx="4" fill="#00923F" />
                <rect x="68" y="38" width="24" height="24" rx="4" fill="#00923F" />
                
                <rect x="8" y="68" width="24" height="24" rx="4" fill="#00923F" />
                <rect x="38" y="68" width="24" height="24" rx="4" fill="#00923F" />
                <rect x="68" y="68" width="24" height="24" rx="4" fill="#00923F" />
            </svg>
        </td>
        <td valign="middle">
            <font size="2" face="Arial">INSTITUTO FEDERAL<br>São Paulo<br>Câmpus Bragança Paulista</font>
        </td>
        <td align="right" valign="middle">
            <h2>Sistema Hipotético para Atividade Prática</h2>
        </td>
    </tr>
</table>
<hr>

    <br><br>
    <center>
        <form action="working.html" method="get">
            <table border="0" cellpadding="5">
                <tr>
                    <td align="right"><b>USUÁRIO:</b></td>
                    <td><input type="text" name="usuario" id="usuario"></td>
                </tr>
                <tr>
                    <td align="right"><b>SENHA:</b></td>
                    <td><input type="password" name="senha" id="senha"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <input type="submit" value="ENTRAR">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>
</html>
